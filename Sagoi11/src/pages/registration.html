<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAGOI Registration</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #444;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    input[type="checkbox"] {
      margin-right: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
    }

    button {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 540px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>SAGOI Membership Registration</h2>
    <form>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <label for="mobile">Mobile Number</label>
      <input type="text" id="mobile" name="mobile" required />

      <label for="category">Occupation Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select Category --</option>
        <option value="student">Student</option>
        <option value="employed">Employed</option>
        <option value="business">Business</option>
        <option value="freelancer">Freelancer</option>
        <option value="unemployed">Unemployed</option>
      </select>

      <label for="income" class="form-label">Annual Income</label>
      <select class="form-select" id="income" name="income" required>
        <option value="">-- Select Income Category --</option>
        <option value="0-1L">₹0 – ₹1 Lakh</option>
        <option value="1L-3L">₹1 Lakh – ₹3 Lakh</option>
        <option value="3L-10L">₹3 Lakh – ₹10 Lakh</option>
        <option value="10L-20L">₹10 Lakh – ₹20 Lakh</option>
        <option value="20L-48L">₹20 Lakh – ₹48 Lakh</option>
        <option value="48L+">₹48 Lakh+</option>
      </select>
      <input type="number" id="income" name="income" required />

      <label for="city">City</label>
      <input type="text" id="city" name="city" required />

      <label for="state">State</label>
      <input type="text" id="state" name="state" required />

      <label for="referral">Referral Code (Optional)</label>
      <input type="text" id="referral" name="referral" />

      <div class="checkbox-label">
        <input type="checkbox" id="terms" required />
        <label for="terms">I agree to the Terms & Conditions</label>
      </div>

      <button type="submit">Register</button>
    </form>
  </div>
</body>
</html>
